<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MichyHub Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ══ DASHBOARD VIEW ══ -->
  <div id="dashboard-view">

    <header>
      <div class="header-badge">✦ MichyHub Tools</div>
      <h1>Your <span>Creative</span><br/>Command Centre</h1>
      <p>Click any card to launch your tool instantly</p>
      <div class="header-divider"></div>
    </header>

    <div class="grid-wrapper">

      <div class="section-label">Marketing &amp; Sales</div>
      <div class="grid" id="marketing-grid"></div>

      <div class="section-label">Content Creation</div>
      <div class="grid" id="content-grid"></div>

      <div class="section-label">Tools &amp; Utilities</div>
      <div class="grid" id="tools-grid"></div>

    </div>

    <footer>michyhub.com.ng &nbsp;·&nbsp; All tools in one place</footer>

  </div><!-- /dashboard-view -->


  <!-- ══ TOOL VIEWER VIEW ══ -->
  <div id="viewer-view">

    <div class="back-bar">
      <button class="back-btn" id="back-btn" aria-label="Back to dashboard"></button>
      <span class="back-bar-title" id="back-bar-title"></span>
    </div>

    <iframe
      id="tool-frame"
      src="about:blank"
      title="Tool viewer"
      allow="fullscreen"
    ></iframe>

  </div><!-- /viewer-view -->


  <script src="script.js"></script>
</body>
</html>
