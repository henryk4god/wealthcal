<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Outline Prompt Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📘 Product Outline Prompt Generator</h1>
            <p>Turn your product ideas into structured ebook & course prompts instantly.</p>
        </header>

        <main class="generator-card">
            <form id="promptForm">
                <div class="input-group">
                    <label for="title">Product Name</label>
                    <input type="text" id="title" placeholder="e.g., Ultimate Freelancer Blueprint" required>
                </div>
                
                <div class="input-group">
                    <label for="steps">Step-by-Step Solution</label>
                    <textarea id="steps" placeholder="e.g., 1. Niche selection&#10;2. Portfolio building&#10;3. Client outreach..." required></textarea>
                </div>

                <div class="input-group">
                    <label for="painPoints">Key Pain Points</label>
                    <textarea id="painPoints" placeholder="e.g., Lack of clients, inconsistent income, pricing confusion" required></textarea>
                </div>

                <div class="input-group">
                    <label for="uvp">Unique Value Proposition (UVP)</label>
                    <input type="text" id="uvp" placeholder="e.g., Fast-track your first ₦1M in 30 days" required>
                </div>

                <div class="input-group">
                    <label for="audience">Target Audience</label>
                    <input type="text" id="audience" placeholder="e.g., Beginners, Side-hustlers, Creative freelancers" required>
                </div>

                <button type="submit" class="btn-generate">
                    <span class="btn-text">Generate Prompt</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
        </main>

        <section id="outputSection" class="output-card hidden">
            <div class="output-header">
                <h2>✨ Generated Prompt</h2>
                <button id="copyBtn" class="btn-copy">📋 Copy to Clipboard</button>
            </div>
            <pre id="promptOutput"></pre>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
