<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACEBOOK MARKETING GENERATOR PROMPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <span class="badge">AI-POWERED TOOL</span>
        <div class="icon-container">🎯</div>
        <h1>FACEBOOK MARKETING GENERATOR PROMPT</h1>
        <p>Convert your product criteria into a comprehensive, module-driven production prompt architecture instantly.</p>
    </header>

    <main>
        <div class="form-card">
            <div class="template-selector">
                <label class="radio-label">
                    <input type="radio" name="template" value="template1" checked>
                    Template 1
                </label>
            </div>

            <form id="generatorForm">
                <div class="input-group">
                    <label for="problemIdea">Problem Idea</label>
                    <input type="text" id="problemIdea" placeholder="e.g., Local businesses struggling to get clients from Facebook ads" required>
                </div>

                <div class="input-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" placeholder="e.g., Local Client Hyper-Growth System" required>
                </div>

                <div class="input-group">
                    <label for="subtitle">Subtitle</label>
                    <input type="text" id="subtitle" placeholder="e.g., The Step-by-Step Blueprint to Booking 10+ High-Paying Clients Monthly" required>
                </div>

                <div class="input-group">
                    <label for="skillTopic">The Skill/Topic I Will Teach</label>
                    <input type="text" id="skillTopic" placeholder="e.g., Facebook Direct Response Advertising & High-Ticket Closing" required>
                </div>

                <div class="input-group">
                    <label for="resourceHave">The Resource They Already Have</label>
                    <input type="text" id="resourceHave" placeholder="e.g., A smartphone, a Facebook page, and $5 a day for ad spend" required>
                </div>

                <div class="input-group">
                    <label for="solution">Logical Step-By-Step Solution</label>
                    <textarea id="solution" placeholder="e.g., 1. Dynamic ad configuration, 2. Message-based conversion funnels, 3. Frictionless WhatsApp pipeline scripts." required></textarea>
                </div>

                <div class="input-group">
                    <label for="painPoints">Key Pain Points</label>
                    <textarea id="painPoints" placeholder="e.g., Wasting money on boosted posts, confusing Ads Manager layouts, leads ghosting on them." required></textarea>
                </div>

                <div class="input-group">
                    <label for="uvp">Unique Value Proposition</label>
                    <input type="text" id="uvp" placeholder="e.g., Zero complex landing pages needed—go straight from Facebook feed to WhatsApp checkout." required>
                </div>

                <div class="input-group">
                    <label for="audience">Target Audience</label>
                    <input type="text" id="audience" placeholder="e.g., Solopreneurs, digital agencies, and local service providers" required>
                </div>

                <button type="submit" class="btn-generate" id="submitBtn">
                    <span class="spinner" id="spinner"></span>
                    <span id="btnText">Generate Master Prompt</span>
                </button>
            </form>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-header">
                <h2>Your Compiled System Prompt</h2>
                <button class="btn-copy" id="copyBtn">Copy Prompt</button>
            </div>
            <pre class="prompt-preview" id="promptOutput"></pre>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
