<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Invoice & Receipt Generator · PDF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Disable double-tap zoom on buttons -->
    <style>
        .btn, .doc-type-btn, .btn-add-item, .remove-item {
            touch-action: manipulation;
        }
        
        /* Prevent text selection on buttons for better UX */
        .btn, .doc-type-btn, .btn-add-item {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <h1><i class="fas fa-receipt"></i> Invoice & Receipt Generator · PDF</h1>

        <div class="row">
            <!-- FORM panel -->
            <div class="form-panel">
                <h2><i class="fas fa-pen-fancy"></i> Document details</h2>

                <!-- Document Type Selector -->
                <div class="doc-type-selector">
                    <button class="doc-type-btn active" data-type="invoice" id="docTypeInvoice">
                        <i class="fas fa-file-invoice"></i> Invoice
                    </button>
                    <button class="doc-type-btn" data-type="receipt" id="docTypeReceipt">
                        <i class="fas fa-check-circle"></i> Receipt
                    </button>
                </div>

                <div class="form-group">
                    <label>Client name</label>
                    <input type="text" id="clientName" value="SAMCHISKA" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="clientEmail" value="henryk4chosen@gmail.com" autocomplete="off">
                </div>
                <div class="inline-group">
                    <div class="form-group">
                        <label>Document date</label>
                        <input type="date" id="docDate" value="2025-08-01">
                    </div>
                    <div class="form-group" id="dueDateGroup">
                        <label>Due date</label>
                        <input type="date" id="dueDate" value="2025-08-23">
                    </div>
                </div>
                <div class="form-group">
                    <label>Document #</label>
                    <input type="text" id="docNumber" value="INV-000002" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Subject / Description</label>
                    <input type="text" id="subjectLine" value="Hosting And Domain Subscription" autocomplete="off">
                </div>

                <!-- Items Section -->
                <div class="form-group">
                    <label>Line Items</label>
                    <div class="items-container" id="itemsContainer">
                        <!-- Items will be added here dynamically -->
                    </div>
                    <button class="btn-add-item" id="addItemBtn">
                        <i class="fas fa-plus"></i> Add Item
                    </button>
                </div>

                <div class="inline-group">
                    <div class="form-group">
                        <label>VAT (%)</label>
                        <input type="number" id="vatRate" value="7.5" step="0.1">
                    </div>
                    <div class="form-group" id="paymentAmountGroup" style="display:none;">
                        <label>Payment Amount (NGN)</label>
                        <input type="number" id="paymentAmount" value="75250" step="0.01">
                    </div>
                </div>

                <div class="form-group">
                    <label>Bank / Account (for payment note)</label>
                    <input type="text" id="bankDetails" value="Account No: 2023268027 · Bank: UBA · Henry Lucky" autocomplete="off">
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="generateBtn"><i class="fas fa-sync"></i> Generate Preview</button>
                    <button class="btn btn-success" id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> Download PDF</button>
                </div>
            </div>

            <!-- PREVIEW panel -->
            <div class="preview-panel">
                <div class="preview-header">
                    <span><i class="fas fa-eye"></i> Live preview</span>
                    <span class="badge"><i class="far fa-file-pdf"></i> PDF ready</span>
                </div>
                <div class="pdf-preview-area" id="pdfPreviewArea">
                    <div id="previewContent" class="invoice-preview">
                        <p class="text-muted" style="text-align:center; padding: 40px 0;">
                            <i class="fas fa-arrow-up" style="margin-right: 8px;"></i> 
                            Add items and generate document
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
