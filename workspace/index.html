<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Workspace Pro — Content Command Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="top-nav">
            <div class="nav-brand">
                <div class="brand-logo">⚡</div>
                <div class="brand-text">
                    <h1>Study and Grow With Today's Bible Teachings</h1>
                    <span>Your Private Content Command Center</span>
                </div>
            </div>

            <div class="nav-actions">
                <button id="theme-toggle" class="btn btn-icon" title="Toggle Light/Dark Mode">
                    <span class="theme-icon-sun">☀️</span>
                    <span class="theme-icon-moon">🌙</span>
                </button>
            </div>
        </header>

        <main class="main-layout">
            
            <section class="workspace">
                <div class="workspace-header">
                    <div class="active-note-meta">
                        <input type="text" id="active-note-title" placeholder="Untitled Document" value="Scratchpad Workspace">
                        <div class="meta-details">
                            <span id="autosave-indicator" class="save-indicator">Synced locally</span>
                        </div>
                    </div>
                    
                    <div class="workspace-actions">
                        <button id="btn-fetch-instructions" class="btn btn-secondary btn-sm" title="Fetch configuration instructions">
                            📥 Fetch Instructions
                        </button>
                        <button id="btn-download-source" class="btn btn-secondary btn-sm" title="Download matching source file">
                            💾 Download Source
                        </button>
                        <button id="btn-clear-workspace" class="btn btn-outline btn-sm btn-danger-text" title="Clear entire editing canvas">
                            🧹 Clear Area
                        </button>
                    </div>
                </div>

                <div class="editor-toolbar">
                    <div class="toolbar-group">
                        <button class="tb-btn" data-command="bold" title="Bold (Ctrl+B)"><b>B</b></button>
                        <button class="tb-btn" data-command="italic" title="Italic (Ctrl+I)"><i>I</i></button>
                        <button class="tb-btn" data-command="underline" title="Underline (Ctrl+U)"><u>U</u></button>
                        <button class="tb-btn" data-command="strikeThrough" title="Strikethrough"><s>S</s></button>
                    </div>
                    <div class="toolbar-divider"></div>
                    
                    <div class="toolbar-group color-picker-wrapper">
                        <span class="color-picker-label">🎨</span>
                        <input type="color" id="tb-forecolor" title="Choose Text Color" value="#3b82f6">
                    </div>
                    
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-group">
                        <button class="tb-btn" data-command="formatBlock" data-value="H1" title="Heading 1">H1</button>
                        <button class="tb-btn" data-command="formatBlock" data-value="H2" title="Heading 2">H2</button>
                        <button class="tb-btn" data-command="formatBlock" data-value="H3" title="Heading 3">H3</button>
                        <button class="tb-btn" data-command="formatBlock" data-value="p" title="Paragraph">P</button>
                    </div>
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-group">
                        <button class="tb-btn" data-command="insertUnorderedList" title="Bullet List">• List</button>
                        <button class="tb-btn" data-command="insertOrderedList" title="Numbered List">1. List</button>
                        <button class="tb-btn" data-command="formatBlock" data-value="blockquote" title="Quote">“ ”</button>
                        <button class="tb-btn" data-command="formatBlock" data-value="pre" title="Code Block">&lt;/&gt;</button>
                    </div>
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-group">
                        <button class="tb-btn" id="tb-link" title="Insert Link">🔗</button>
                        <button class="tb-btn" id="tb-table" title="Insert Table">📊</button>
                    </div>
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-group history-controls">
                        <button class="tb-btn" id="tb-undo" title="Undo (Ctrl+Z)">↩️</button>
                        <button class="tb-btn" id="tb-redo" title="Redo (Ctrl+Y)">↪️</button>
                    </div>
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-group mobile-find-toggle">
                        <button class="tb-btn" id="tb-toggle-find" title="Open Find &amp; Replace">🔍 Find</button>
                    </div>
                </div>

                <div class="editor-canvas-wrapper">
                    <div id="editor-core" contenteditable="true" placeholder="Paste your generation prompts or begin drafting here..."></div>
                </div>

                <footer class="editor-footer">
                    <div class="metrics-group">
                        <span>Words: <strong id="metric-words">0</strong></span>
                        <span>Characters: <strong id="metric-chars">0</strong></span>
                    </div>
                    <div id="last-saved-stamp" class="timestamp-stamp">
                        Last Saved: Never
                    </div>
                </footer>
            </section>

            <aside class="quick-panel">
                <div class="panel-section">
                    <div class="panel-title">⚡ Find &amp; Replace</div>
                    <div class="find-replace-card">
                        <input type="text" id="fr-find" placeholder="Find text...">
                        <input type="text" id="fr-replace" placeholder="Replace with...">
                        
                        <div class="toggle-row">
                            <label class="toggle-lbl">
                                <input type="checkbox" id="fr-case"> Case Sensitive
                            </label>
                            <label class="toggle-lbl">
                                <input type="checkbox" id="fr-word"> Whole Word
                            </label>
                        </div>

                        <div class="action-grid">
                            <button id="btn-fr-next" class="btn btn-secondary btn-sm">Find Next</button>
                            <button id="btn-fr-replace" class="btn btn-secondary btn-sm">Replace</button>
                            <button id="btn-fr-all" class="btn btn-action-primary btn-sm">Replace All</button>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <div class="panel-title">🧩 AI Utilities &amp; Quick Snippets</div>
                    <div class="snippet-grid">
                        <button class="btn-snippet" data-snippet="Summarize this: ">📝 Summarize Prompt</button>
                        <button class="btn-snippet" data-snippet="Expand on this technical draft: ">🚀 Expand Concept</button>
                        <button class="btn-snippet" data-snippet="Rewrite this copy for high-conversion marketing: ">💰 Marketing Hook</button>
                        <button class="btn-snippet" data-snippet="Fix all grammar, voice consistency, and structural flow in this content: ">🔧 Refine Prose</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
