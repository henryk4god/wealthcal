<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Workspace Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sidebar">
<h2>Creator Workspace</h2>
<div id="tabs"></div>
<hr>
<button id="themeToggle">🌙 Theme</button>
</div>

<div class="main">
<div class="topbar">
<input id="search" placeholder="Search notes...">
<input id="findText" placeholder="Find">
<input id="replaceText" placeholder="Replace">
<button onclick="replaceOne()">Replace</button>
<button onclick="replaceAllText()">Replace All</button>
</div>

<textarea id="editor" placeholder="Paste prompt output here..."></textarea>

<div class="stats">
<span id="words"></span>
<span id="chars"></span>
<span id="reading"></span>
<span id="saveStatus"></span>
</div>

<div class="toolbar">
<button onclick="saveNote()">💾 Save</button>
<button onclick="downloadTXT()">TXT</button>
<button onclick="downloadJSON()">JSON</button>
<button onclick="importJSON()">Import JSON</button>
</div>

<h3>Quick Snippets</h3>
<div class="snippets">
<button onclick="insertSnippet('[CTA]')">CTA</button>
<button onclick="insertSnippet('[Facebook Ad]')">Facebook Ad</button>
<button onclick="insertSnippet('[Offer Stack]')">Offer Stack</button>
<button onclick="insertSnippet('[Guarantee]')">Guarantee</button>
</div>

<h3>Notes</h3>
<div id="notes"></div>
</div>
<script src="app.js"></script>
</body>
</html>
