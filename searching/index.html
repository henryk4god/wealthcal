<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Research Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero-banner">
        <span class="badge-label">AI-Powered Tool</span>
        <span class="app-icon">🎯</span>
        <h1 class="app-title">Digital Research Generator</h1>
        <p class="app-tagline">Instantly build hyper-targeted backend strategies for high-converting marketing campaigns</p>
    </header>

    <main class="container">
        
        <section class="form-card">
            
            <label class="section-label">1. Choose Target Niche Category</label>
            <div class="category-grid" id="categoryTabs">
                <button class="category-tab active" data-target="womensSelect">👩 Women's Needs</button>
                <button class="category-tab" data-target="businessSelect">💼 Business</button>
                <button class="category-tab" data-target="moneySelect">💰 Money</button>
                <button class="category-tab" data-target="healthSelect">🏥 Health</button>
                <button class="category-tab" data-target="relationshipSelect">❤️ Relationship</button>
                <button class="category-tab" data-target="skincareSelect">✨ Skin Care</button>
                <button class="category-tab" data-target="educationSelect">🎓 Education</button>
                <button class="category-tab" data-target="travelingSelect">✈️ Traveling</button>
            </div>

            <label class="section-label">2. Select Audience Persona Attribute</label>
            <div class="select-container">
                
                <div class="select-wrapper active" id="womensSelect">
                    <select class="select-menu">
                        <option value="Pregnant women">Pregnant women</option>
                        <option value="Women who are about to get married">Women who are about to get married</option>
                        <option value="Single ladies">Single ladies</option>
                        <option value="Women looking to get pregnant">Women looking to get pregnant</option>
                    </select>
                </div>

                <div class="select-wrapper" id="businessSelect">
                    <select class="select-menu">
                        <option value="A man or woman who wants to Start A Business">A man or woman who wants to Start A Business</option>
                        <option value="A man or woman who wants to Become Self-Employed">A man or woman who wants to Become Self-Employed</option>
                        <option value="A man or woman who needs to Raise Capital">A man or woman who needs to Raise Capital</option>
                        <option value="A man or woman who wants to Invest">A man or woman who wants to Invest</option>
                        <option value="A man or woman who wants to Determine High-Paying Business">A man or woman who wants to Determine High-Paying Business</option>
                        <option value="A man or woman who needs Best Business Strategy and Plan">A man or woman who needs Best Business Strategy and Plan</option>
                        <option value="A man or woman who wants to Grow A business">A man or woman who wants to Grow A business</option>
                        <option value="A man or woman who needs to Handle Employees">A man or woman who needs to Handle Employees</option>
                        <option value="A man or woman who wants to Brand Their Business">A man or woman who wants to Brand Their Business</option>
                        <option value="A man or woman who wants to Promote Products on Social Media">A man or woman who wants to Promote Products on Social Media</option>
                    </select>
                </div>

                <div class="select-wrapper" id="moneySelect">
                    <select class="select-menu">
                        <option value="A man or woman who wants a High paying Job">A man or woman who wants a High paying Job</option>
                        <option value="A man or woman who wants to Learn High Paying Skill">A man or woman who wants to Learn High Paying Skill</option>
                        <option value="A man or woman who wants to Pass Job Interviews">A man or woman who wants to Pass Job Interviews</option>
                        <option value="A man or woman who wants to Work Abroad">A man or woman who wants to Work Abroad</option>
                        <option value="A man or woman who wants to Work From Home">A man or woman who wants to Work From Home</option>
                        <option value="A man or woman who wants to Make Money Online">A man or woman who wants to Make Money Online</option>
                        <option value="A man or woman who wants to Make money on YouTube, Facebook, Instagram">A man or woman who wants to Make money on YouTube, Facebook, Instagram</option>
                    </select>
                </div>

                <div class="select-wrapper" id="healthSelect">
                    <select class="select-menu">
                        <option value="A man or woman with Bad Metabolism And Poor Digestion">A man or woman with Bad Metabolism And Poor Digestion</option>
                        <option value="A man or woman looking for Solution To Aging">A man or woman looking for Solution To Aging</option>
                        <option value="A man or woman who wants to Cure Diabetes">A man or woman who wants to Cure Diabetes</option>
                        <option value="A woman looking for Natural Remedy For Fibroids">A woman looking for Natural Remedy For Fibroids</option>
                        <option value="A man or woman with Poor Vision">A man or woman with Poor Vision</option>
                        <option value="A man or woman who is Fatty And Over Weight">A man or woman who is Fatty And Over Weight</option>
                        <option value="A man or woman who wants to Get Six Pack">A man or woman who wants to Get Six Pack</option>
                        <option value="A man or woman who wants to Build Muscles">A man or woman who wants to Build Muscles</option>
                        <option value="A man or woman looking for Natural remedy for Kidney, Liver And Heartburn diseases">A man or woman looking for Natural remedy for Kidney, Liver And Heartburn diseases</option>
                        <option value="A man or woman who wants to Cure High Blood Pressure">A man or woman who wants to Cure High Blood Pressure</option>
                    </select>
                </div>

                <div class="select-wrapper" id="relationshipSelect">
                    <select class="select-menu">
                        <option value="A man or woman who wants to Get Ex Back">A man or woman who wants to Get Ex Back</option>
                        <option value="A man who wants to Get Women">A man who wants to Get Women</option>
                        <option value="A woman who wants to Attract A Man">A woman who wants to Attract A Man</option>
                        <option value="A man or woman with Abusive Spouse">A man or woman with Abusive Spouse</option>
                        <option value="A man with Small Penis">A man with Small Penis</option>
                        <option value="A man or woman with Cheating Spouse">A man or woman with Cheating Spouse</option>
                        <option value="A man or woman in Friendship Zone">A man or woman in Friendship Zone</option>
                        <option value="A man or woman who wants to Attract Partners Online">A man or woman who wants to Attract Partners Online</option>
                        <option value="A man or woman who wants to Satisfy Women Organism">A man or woman who wants to Satisfy Women Organism</option>
                        <option value="A man with Premature Emasculation">A man with Premature Emasculation</option>
                    </select>
                </div>

                <div class="select-wrapper" id="skincareSelect">
                    <select class="select-menu">
                        <option value="A man or woman with Eye Bags and Dark Circle">A man or woman with Eye Bags and Dark Circle</option>
                        <option value="A woman with Small Or Sagging Breast">A woman with Small Or Sagging Breast</option>
                        <option value="A man or woman with Wrinkles">A man or woman with Wrinkles</option>
                        <option value="A man or woman with Falling Hair Problems">A man or woman with Falling Hair Problems</option>
                        <option value="A man or woman who wants Whitening">A man or woman who wants Whitening</option>
                        <option value="A man or woman with Pimples & Acne">A man or woman with Pimples & Acne</option>
                        <option value="A man or woman with Dark Knuckles">A man or woman with Dark Knuckles</option>
                        <option value="A man or woman with Dandruff">A man or woman with Dandruff</option>
                        <option value="A man or woman with Cellulite">A man or woman with Cellulite</option>
                        <option value="A man or woman with Stretch Marks">A man or woman with Stretch Marks</option>
                        <option value="A man or woman with Sun Burn & Discolouration">A man or woman with Sun Burn & Discolouration</option>
                        <option value="A woman with Small Butt & Hips">A woman with Small Butt & Hips</option>
                    </select>
                </div>

                <div class="select-wrapper" id="educationSelect">
                    <select class="select-menu">
                        <option value="A student who wants to Study Abroad">A student who wants to Study Abroad</option>
                        <option value="A student who needs to Pay School Fees">A student who needs to Pay School Fees</option>
                        <option value="A student who wants to Pass MBE Exams">A student who wants to Pass MBE Exams</option>
                        <option value="A student who wants to Pass International Exams (TOEFL)">A student who wants to Pass International Exams (TOEFL)</option>
                        <option value="A student who wants to Pass JAMB & WAEC, NECO">A student who wants to Pass JAMB & WAEC, NECO</option>
                        <option value="A student who wants to Get Scholarship">A student who wants to Get Scholarship</option>
                        <option value="A student who wants to Improve Brain Retention">A student who wants to Improve Brain Retention</option>
                        <option value="A student who wants to Become An Expert In Math">A student who wants to Become An Expert In Math</option>
                        <option value="A student who wants to Pass Finals Exam">A student who wants to Pass Finals Exam</option>
                        <option value="A student who wants to Pass Bar Exam">A student who wants to Pass Bar Exam</option>
                    </select>
                </div>

                <div class="select-wrapper" id="travelingSelect">
                    <select class="select-menu">
                        <option value="A student who wants to Travel Abroad">A student who wants to Travel Abroad</option>
                        <option value="A man or woman who wants to Get Working Permit">A man or woman who wants to Get Working Permit</option>
                        <option value="A man or woman who wants to Get Permanent Stay">A man or woman who wants to Get Permanent Stay</option>
                    </select>
                </div>

            </div>

            <button class="btn-generate" id="generateBtn">
                <div class="spinner" id="btnSpinner"></div>
                <span id="btnText">Generate Engineered Prompt</span>
            </button>

        </section>

        <section class="result-card" id="resultCard">
            <div class="result-header">
                <div class="result-title-area">
                    <h3>Your System Prompt Ready</h3>
                </div>
                <button class="btn-copy" id="copyBtn">
                    <span>📋</span> <span id="copyBtnText">Copy Prompt</span>
                </button>
            </div>
            <div class="prompt-output-box" id="promptResultOutput"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
