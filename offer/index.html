<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFFER GENERATOR</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>🎯 OFFER GENERATOR</h1>
      <p>Transform any idea into a high-converting digital product offer</p>
    </header>
    
    <main class="main-content">
      <form id="offerForm" class="offer-form">
        <div class="form-group">
          <label for="productName">Product Name / Title</label>
          <input type="text" id="productName" name="productName" placeholder="e.g., The 30-Day Real Estate Blueprint" required>
        </div>
        <div class="form-group">
          <label for="targetAudience">Target Audience</label>
          <input type="text" id="targetAudience" name="targetAudience" placeholder="e.g., Nigerian professionals aged 25-45" required>
        </div>
        <div class="form-group">
          <label for="stepByStep">Step-by-Step Solution</label>
          <textarea id="stepByStep" name="stepByStep" rows="3" placeholder="Briefly describe the core steps or system your product teaches" required></textarea>
        </div>
        <div class="form-group">
          <label for="painPoints">Key Pain Points</label>
          <textarea id="painPoints" name="painPoints" rows="3" placeholder="e.g., Lack of capital, confusing regulations, fear of scams" required></textarea>
        </div>
        <div class="form-group">
          <label for="uvp">Unique Value Proposition (UVP)</label>
          <input type="text" id="uvp" name="uvp" placeholder="What makes your offer different & irresistible?" required>
        </div>
        <button type="submit" id="generateBtn" class="btn-generate">
          <span class="btn-text">Generate Offer</span>
          <span class="btn-loading hidden">
            <span class="spinner"></span> Generating...
          </span>
        </button>
      </form>

      <section id="resultSection" class="result-section hidden">
        <div class="result-card">
          <div class="result-header">
            <h2>🚀 Your High-Converting Offer</h2>
            <button id="copyBtn" class="btn-copy" title="Copy to Clipboard">📋 Copy</button>
          </div>
          <pre id="resultOutput" class="result-output"></pre>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
