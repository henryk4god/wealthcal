<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry's Simple Learning App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #27AE60;
    --green-light: #EAFAF1;
    --green-dark: #1E8449;
    --yellow: #F9CA24;
    --blue: #2980B9;
    --blue-light: #EBF5FB;
    --orange: #E67E22;
    --red: #E74C3C;
    --white: #FFFFFF;
    --gray: #F4F6F8;
    --text: #2C3E50;
    --text-light: #7F8C8D;
    --border: #D5DBDB;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
  }

  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 30px 20px 20px;
    color: white;
  }

  .header .emoji { font-size: 52px; display: block; margin-bottom: 10px; }

  .header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 15px;
    opacity: 0.85;
    font-weight: 500;
  }

  /* CARD */
  .card {
    background: white;
    border-radius: 24px;
    padding: 28px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 16px;
  }

  /* SETUP FORM */
  .setup-label {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 800;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: block;
  }

  .setup-input {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 14px;
    font-family: 'Quicksand', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 18px;
    outline: none;
    background: var(--gray);
  }

  .setup-input:focus {
    border-color: #764ba2;
    background: white;
    box-shadow: 0 0 0 4px rgba(118,75,162,0.1);
  }

  .setup-input::placeholder { color: #BDC3C7; font-weight: 500; }

  .btn-start {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    letter-spacing: 0.3px;
  }

  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.5); }
  .btn-start:active { transform: translateY(0); }
  .btn-start:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* SESSION INFO BAR */
  .session-bar {
    display: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 16px;
    color: white;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .session-bar .tag {
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 700;
  }

  .session-bar .topic-name {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    flex: 1;
  }

  /* LESSON SCORE */
  .score-badge {
    background: var(--yellow);
    color: #5D4037;
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* CHAT AREA */
  .chat-area {
    min-height: 300px;
    max-height: 500px;
    overflow-y: auto;
    padding: 4px 0 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #D5DBDB; border-radius: 4px; }

  /* MESSAGES */
  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg.ai .msg-avatar { background: linear-gradient(135deg, #667eea, #764ba2); }
  .msg.user .msg-avatar { background: var(--green-light); border: 2px solid var(--green); }

  .msg-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    font-weight: 500;
  }

  .msg.ai .msg-bubble {
    background: var(--gray);
    color: var(--text);
    border-top-left-radius: 4px;
  }

  .msg.user .msg-bubble {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-top-right-radius: 4px;
  }

  .msg-bubble strong { font-weight: 800; }
  .msg-bubble em { font-style: italic; opacity: 0.85; }

  /* TYPING INDICATOR */
  .typing {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 4px 0;
  }

  .typing-dots {
    background: var(--gray);
    border-radius: 18px;
    border-top-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-dot {
    width: 8px; height: 8px;
    background: #BDC3C7;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* INPUT AREA */
  .input-area {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 2px solid var(--gray);
    align-items: flex-end;
  }

  .chat-input {
    flex: 1;
    padding: 13px 16px;
    border: 2px solid var(--border);
    border-radius: 14px;
    font-family: 'Quicksand', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 120px;
    transition: border-color 0.2s;
    background: var(--gray);
  }

  .chat-input:focus {
    border-color: #764ba2;
    background: white;
  }

  .chat-input::placeholder { color: #BDC3C7; font-weight: 500; }

  .btn-send {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
    flex-shrink: 0;
  }

  .btn-send:hover { transform: translateY(-2px); }
  .btn-send:active { transform: translateY(0); }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* BOTTOM ACTIONS */
  .bottom-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .btn-action {
    padding: 9px 16px;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
  }

  .btn-new {
    background: var(--green-light);
    color: var(--green-dark);
    border-color: var(--green);
  }

  .btn-new:hover { background: var(--green); color: white; }

  .btn-repeat {
    background: var(--blue-light);
    color: var(--blue);
    border-color: var(--blue);
  }

  .btn-repeat:hover { background: var(--blue); color: white; }

  /* HIDDEN */
  .hidden { display: none !important; }

  /* WELCOME NOTE */
  .welcome-note {
    background: linear-gradient(135deg, #EAFAF1, #D5F5E3);
    border: 2px solid var(--green);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 20px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .welcome-note .icon { font-size: 24px; flex-shrink: 0; margin-top: 2px; }

  .welcome-note p {
    font-size: 14px;
    font-weight: 600;
    color: var(--green-dark);
    line-height: 1.6;
  }

  /* LESSON COUNT */
  .lesson-count {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 600;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <span class="emoji">🎓</span>
    <h1>Henry's Simple Learning App</h1>
    <p>Learn anything — explained like you're 5 years old</p>
  </div>

  <!-- SETUP CARD -->
  <div class="card" id="setupCard">
    <div class="welcome-note">
      <span class="icon">💡</span>
      <p>Type any topic you want to learn and your goal. The AI teacher will guide you step by step — simply and clearly!</p>
    </div>

    <label class="setup-label" for="topicInput">📚 What do you want to learn?</label>
    <input class="setup-input" id="topicInput" type="text" placeholder="e.g. How to write a sales email, Crowdfunding, Digital Marketing..." />

    <label class="setup-label" for="goalInput">🎯 What is your goal?</label>
    <input class="setup-input" id="goalInput" type="text" placeholder="e.g. To offer this as a paid service and earn money from it..." />

    <button class="btn-start" id="startBtn" onclick="startLesson()">🚀 Start My Lesson!</button>
  </div>

  <!-- SESSION BAR -->
  <div class="session-bar hidden" id="sessionBar">
    <span class="tag">📚 Topic</span>
    <span class="topic-name" id="sessionTopic"></span>
    <span class="score-badge" id="scoreBadge" style="display:none">⭐ Score: <span id="scoreVal">-</span></span>
  </div>

  <!-- CHAT CARD -->
  <div class="card hidden" id="chatCard">
    <div class="chat-area" id="chatArea"></div>

    <div class="input-area">
      <textarea class="chat-input" id="chatInput" placeholder="Type your answer here..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <div class="bottom-actions">
      <button class="btn-action btn-new" onclick="newLesson()">🔄 New Topic</button>
      <button class="btn-action btn-repeat" onclick="repeatExplanation()">🔁 Explain Again Simpler</button>
    </div>

    <p class="lesson-count" id="lessonCount"></p>
  </div>

</div>

<script>
  let conversationHistory = [];
  let currentTopic = '';
  let currentGoal = '';
  let messageCount = 0;

  function buildSystemPrompt(topic, goal) {
    return `You are a warm, encouraging AI teacher named "Teacher Claude". Your student is Henry, an adult learner who wants to understand things clearly and simply.

Your teaching style:
- Always explain like the student is 5 years old — simple words, no jargon
- Use everyday real-life examples and comparisons they already know
- Teach ONE small step at a time, never overwhelm
- After each explanation, ask ONE simple check question to confirm understanding
- When the student answers: celebrate correct answers warmly (use emojis), gently correct wrong answers with kindness and explain why
- Never use technical words without first explaining them in simple terms
- Use analogies from real life (cooking, sports, shopping, family, etc.)
- Keep responses conversational and friendly, never too long
- Use emojis naturally to make learning feel fun
- At every 5th message, give the student a quick score out of 10 and one encouragement tip

Current lesson topic: "${topic}"
Student's goal: "${goal}"

Start by introducing the topic in the simplest, most exciting way possible. Make the student feel confident they CAN learn this. Then teach the very first concept — just one — and ask a simple check question at the end.`;
  }

  async function startLesson() {
    const topic = document.getElementById('topicInput').value.trim();
    const goal = document.getElementById('goalInput').value.trim();

    if (!topic || !goal) {
      alert('Please fill in both the topic and your goal! 😊');
      return;
    }

    currentTopic = topic;
    currentGoal = goal;
    conversationHistory = [];
    messageCount = 0;

    // Switch views
    document.getElementById('setupCard').classList.add('hidden');
    document.getElementById('sessionBar').classList.remove('hidden');
    document.getElementById('chatCard').classList.remove('hidden');
    document.getElementById('sessionTopic').textContent = topic;
    document.getElementById('chatArea').innerHTML = '';

    // Start the lesson
    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;

    showTyping();

    try {
      const systemPrompt = buildSystemPrompt(topic, goal);

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: "user", content: `Please start my lesson on: ${topic}. My goal is: ${goal}` }]
        })
      });

      const data = await response.json();
      const aiText = data.content[0].text;

      conversationHistory.push({ role: "user", content: `Please start my lesson on: ${topic}. My goal is: ${goal}` });
      conversationHistory.push({ role: "assistant", content: aiText });

      removeTyping();
      addMessage('ai', aiText);
      updateLessonCount();

    } catch (err) {
      removeTyping();
      addMessage('ai', '😔 Oops! Something went wrong. Please check your connection and try again.');
    }

    startBtn.disabled = false;
  }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    addMessage('user', text);
    messageCount++;
    updateLessonCount();

    conversationHistory.push({ role: "user", content: text });

    document.getElementById('sendBtn').disabled = true;
    showTyping();

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: buildSystemPrompt(currentTopic, currentGoal),
          messages: conversationHistory
        })
      });

      const data = await response.json();
      const aiText = data.content[0].text;

      conversationHistory.push({ role: "assistant", content: aiText });

      removeTyping();
      addMessage('ai', aiText);
      updateLessonCount();

      // Extract score if mentioned
      const scoreMatch = aiText.match(/(\d+)\s*\/\s*10/);
      if (scoreMatch) {
        document.getElementById('scoreBadge').style.display = 'inline-flex';
        document.getElementById('scoreVal').textContent = scoreMatch[1] + '/10';
      }

    } catch (err) {
      removeTyping();
      addMessage('ai', '😔 Something went wrong. Please try again!');
    }

    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatInput').focus();
  }

  async function repeatExplanation() {
    const input = document.getElementById('chatInput');
    input.value = '';
    addMessage('user', '🔁 Please explain that again but even simpler!');
    conversationHistory.push({ role: "user", content: "Please explain that last concept again but even simpler — like I am 5 years old. Use a different real-life example." });

    document.getElementById('sendBtn').disabled = true;
    showTyping();

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: buildSystemPrompt(currentTopic, currentGoal),
          messages: conversationHistory
        })
      });

      const data = await response.json();
      const aiText = data.content[0].text;
      conversationHistory.push({ role: "assistant", content: aiText });

      removeTyping();
      addMessage('ai', aiText);

    } catch (err) {
      removeTyping();
      addMessage('ai', '😔 Something went wrong. Please try again!');
    }

    document.getElementById('sendBtn').disabled = false;
  }

  function newLesson() {
    document.getElementById('setupCard').classList.remove('hidden');
    document.getElementById('chatCard').classList.add('hidden');
    document.getElementById('sessionBar').classList.add('hidden');
    document.getElementById('scoreBadge').style.display = 'none';
    document.getElementById('topicInput').value = '';
    document.getElementById('goalInput').value = '';
    document.getElementById('chatArea').innerHTML = '';
    conversationHistory = [];
    messageCount = 0;
  }

  function addMessage(role, text) {
    const chatArea = document.getElementById('chatArea');

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'ai' ? '🎓' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatText(text);

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function formatText(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    const chatArea = document.getElementById('chatArea');
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.id = 'typingIndicator';
    typing.innerHTML = `
      <div class="msg-avatar" style="background: linear-gradient(135deg,#667eea,#764ba2); width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px;">🎓</div>
      <div class="typing-dots">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    chatArea.appendChild(typing);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function updateLessonCount() {
    const count = document.getElementById('lessonCount');
    if (messageCount > 0) {
      count.textContent = `💬 ${messageCount} exchange${messageCount > 1 ? 's' : ''} in this lesson`;
    }
  }
</script>
</body>
</html>
