<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGAL PAGE GENERATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --primary-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            --accent-glow: rgba(124, 58, 237, 0.15);
            --bg-color: #fce7f3; 
            --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #f0fdf4 50%, #eff6ff 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --text-light: #475569;
            --border-color: rgba(226, 232, 240, 0.8);
            --success-color: #10b981;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(79, 70, 229, 0.08), 0 8px 16px -6px rgba(79, 70, 229, 0.05);
            --shadow-lg: 0 20px 40px -15px rgba(79, 70, 229, 0.15);
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
            padding: 60px 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
        }

        /* Decorative background elements */
        .container::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -15%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
            animation: float 8s ease-in-out infinite alternate;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -5%;
            right: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.06) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
            animation: float 12s ease-in-out infinite alternate-reverse;
        }

        header {
            text-align: left;
            margin-bottom: 40px;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header h1 {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-light);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 32px;
            transition: var(--transition-smooth);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .form-group {
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Staggered form field animations */
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.15s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }
        .form-group:nth-child(4) { animation-delay: 0.25s; }
        .form-group:nth-child(5) { animation-delay: 0.3s; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            text-align: left;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-color);
            background-color: rgba(255, 255, 255, 0.9);
            transition: var(--transition-smooth);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--accent-glow);
            transform: scale([1.005]);
        }

        textarea {
            resize: vertical;
            min-height: 160px;
        }

        .btn-wrapper {
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.35s;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 32px;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 14px rgba(7f, 5a, 237, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(7f, 5a, 237, 0.4);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(7f, 5a, 237, 0.3);
        }

        /* Continuous ripple asset decoration */
        .btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: -100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.6s;
        }

        .btn:hover::after {
            left: 100%;
        }

        .result-container {
            display: none;
            margin-top: 40px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease-out;
        }

        .result-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e1b4b;
        }

        .btn-copy {
            background: #ffffff;
            color: var(--primary-color);
            padding: 10px 24px;
            font-size: 0.9rem;
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: var(--radius-sm);
            width: auto;
            box-shadow: var(--shadow-sm);
        }

        .btn-copy:hover {
            background: #f8fafc;
            border-color: var(--primary-color);
            color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-copy.copied {
            background: var(--success-color);
            color: #ffffff;
            border-color: var(--success-color);
            animation: pulseSuccess 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .output-card {
            padding: 0;
            overflow: hidden;
            border-color: var(--border-color);
        }

        .output-box {
            background-color: #fafbfe;
            padding: 32px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            color: #334155;
            white-space: pre-wrap;
            overflow-x: auto;
            text-align: left;
            max-height: 550px;
            overflow-y: auto;
            border-radius: var(--radius-lg);
        }

        /* Custom Scrollbar styling */
        .output-box::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .output-box::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .output-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .output-box::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .loader {
            display: none;
            justify-content: center;
            align-items: center;
            margin: 32px 0;
            flex-direction: column;
            gap: 16px;
        }

        .spinner-box {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(79, 70, 229, 0.05);
            border-left-color: var(--primary-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        .spinner-inner {
            position: absolute;
            width: 70%;
            height: 70%;
            border: 4px solid rgba(124, 58, 237, 0.05);
            border-right-color: #7c3aed;
            border-bottom-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.5s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite reverse;
        }

        .loader p {
            font-size: 0.95rem;
            color: var(--primary-color);
            font-weight: 500;
            letter-spacing: 0.05em;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        /* Animation Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes pulseSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
            100% { transform: scale(1); }
        }

        @media (max-width: 640px) {
            body {
                padding: 40px 16px;
            }
            header h1 {
                font-size: 2.2rem;
            }
            .card {
                padding: 28px 20px;
                border-radius: var(--radius-md);
            }
            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .btn-copy {
                width: 100%;
            }
            .output-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>LEGAL PAGE GENERATOR</h1>
            <p>Formulate elegant structured front & back matter infrastructure assets instantly.</p>
        </header>

        <div class="card">
            <form id="generatorForm">
                <div class="form-group">
                    <label for="bookTitle">Book Title</label>
                    <input type="text" id="bookTitle" placeholder="e.g., The Crafted Income Blueprint" required>
                </div>

                <div class="form-group">
                    <label for="bookSubtitle">Book Subtitle</label>
                    <input type="text" id="bookSubtitle" placeholder="e.g., Turning Creative Skills into Sustainable Revenue" required>
                </div>

                <div class="form-group">
                    <label for="targetAudience">Target Audience</label>
                    <input type="text" id="targetAudience" placeholder="e.g., Nigerian professionals aged 25-45" required>
                </div>

                <div class="form-group">
                    <label for="tone">Tone</label>
                    <input type="text" id="tone" placeholder="e.g., Friendly, conversational, and encouraging" required>
                </div>

                <div class="form-group">
                    <label for="chapterOutline">Complete Chapter Outline</label>
                    <textarea id="chapterOutline" placeholder="Chapter 1: The Foundation&#10;Chapter 2: Resource Mapping&#10;Chapter 3: Strategic Distribution..." required></textarea>
                </div>

                <div class="btn-wrapper">
                    <button type="submit" class="btn" id="submitBtn">Generate Functional Prompt Asset</button>
                </div>
            </form>
        </div>

        <div class="loader" id="loader">
            <div class="spinner-box">
                <div class="spinner"></div>
                <div class="spinner-inner"></div>
            </div>
            <p>STRUCTURING DATA SYSTEM...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-header">
                <h2>System Core Output</h2>
                <button class="btn btn-copy" id="copyBtn">Copy Prompt Output</button>
            </div>
            <div class="card output-card">
                <pre class="output-box" id="outputBox"></pre>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('generatorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');
            
            submitBtn.disabled = true;
            loader.style.display = 'flex';
            resultContainer.style.display = 'none';

            const inputData = {
                title: document.getElementById('bookTitle').value.trim(),
                subtitle: document.getElementById('bookSubtitle').value.trim(),
                audience: document.getElementById('targetAudience').value.trim(),
                tone: document.getElementById('tone').value.trim(),
                outline: document.getElementById('chapterOutline').value.trim()
            };

            setTimeout(() => {
                const generatedPrompt = simulateAIResponse(inputData);
                document.getElementById('outputBox').textContent = generatedPrompt;
                
                loader.style.display = 'none';
                resultContainer.style.display = 'block';
                submitBtn.disabled = false;
                
                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 1000);
        });

        document.getElementById('copyBtn').addEventListener('click', function() {
            const outputText = document.getElementById('outputBox').textContent;
            const copyBtn = document.getElementById('copyBtn');
            
            navigator.clipboard.writeText(outputText).then(() => {
                copyBtn.textContent = 'Copied Successfully!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = 'Copy Prompt Output';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy data: ', err);
            });
        });

        function simulateAIResponse(inputData) {
            return `You are a bestselling author and professional book formatter. I need you to generate the complete front matter and back matter for my book.

HERE IS MY BOOK INFORMATION:

Book Title: ${inputData.title}

Book Subtitle: ${inputData.subtitle}

Target Audience: ${inputData.audience}

Tone: ${inputData.tone}

Complete Chapter Outline:
${inputData.outline}


INSTRUCTIONS:

Generate the following FIVE sections in this exact order. Write each section completely and professionally.

SECTION 1: INTRODUCTION

Write a compelling book introduction that includes:
- A personal story or relatable problem the reader faces
- Why you wrote this book
- What makes this book different (including any proprietary frameworks)
- What the reader will learn (list 5-7 key outcomes)
- Who this book is for
- How to use the book
- A promise to the reader
- A call to action to begin

Length: 400-600 words
Tone: ${inputData.tone}

SECTION 2: DISCLAIMER

Write a complete legal disclaimer that includes:
- Statement that content is for educational and informational purposes only
- Statement that no professional-client relationship is formed
- Statement that there are no guarantees of results
- Statement about third-party platforms and services
- Statement about regulatory changes
- Statement of no liability
- Acknowledgment that reader is responsible for their own decisions

Tone: Professional, clear, legally protective but not intimidating

SECTION 3: COPYRIGHT

Write a complete copyright notice that includes:
- Copyright symbol, year, and author name
- Statement of all rights reserved
- Rules for unauthorized reproduction
- Rules for permitted excerpts with attribution
- Statement about proprietary frameworks (if applicable)
- Contact email for permission requests
- Publishing details (edition, place of publication)

Tone: Professional and firm but fair

SECTION 4: TABLE OF CONTENTS

Generate a formatted Table of Contents that includes:
- Book title at the top
- "At a Glance" or brief description
- Each chapter number and title (from the outline provided) NO SUB-TOPICS.
- A "Quick Reference" box at the end listing any proprietary frameworks

Format: Clean, scannable, easy to read

SECTION 5: CONCLUSION

Write a powerful book conclusion that includes:
- Acknowledgment that the reader has completed the journey
- Summary of what they should now know or be able to do
- Encouragement to take action (not just read)
- A reminder of the most important framework or lesson from the book
- What comes next (next steps for the reader)
- A final inspiring message
- An invitation to connect or share their success (optional)

Length: 300-500 words
Tone: ${inputData.tone} - warm, encouraging, and action-oriented

ADDITIONAL REQUIREMENTS:

- Use [Your Name] as the author placeholder (I will replace it later)
- Use [Your Email Address] as the contact placeholder
- For proprietary frameworks mentioned in the outline, highlight them with 🔷 symbols
- Keep formatting clean and ready to copy-paste into a manuscript

OUTPUT FORMAT:

Label each section clearly with headers:
--- SECTION 1: INTRODUCTION ---
[content]
--- SECTION 2: DISCLAIMER ---
[content]
--- SECTION 3: COPYRIGHT ---
[content]
--- SECTION 4: TABLE OF CONTENTS ---
[content]
--- SECTION 5: CONCLUSION ---
[content]

⚠️ STRICT RULES:
No introductions, conclusions, or commentary outside the deliverable
No filler text or motivational preamble

Now generate these five sections based on my book information above.

- No explanations,no introductions, no additional text.`;
        }
    </script>

</body>
</html>
