<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Prompt Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <span class="badge">AI-POWERED TOOL</span>
            <div class="app-icon">📜</div>
            <h1>Legal Prompt Generator</h1>
            <p class="tagline">Generate comprehensive, structured front and back matter prompts for your book layout effortlessly.</p>
        </div>
    </header>

    <main class="container">
        <section class="form-card">
            <form id="promptForm">
                <div class="form-group">
                    <label for="bookContent">Book Content Information</label>
                    <span class="field-hint">Include details like Title, Subtitle, and Body Content / Chapter Outline.</span>
                    <textarea 
                        id="bookContent" 
                        placeholder="Enter your book title, subtitle, and core content outlines here..." 
                        required></textarea>
                </div>

                <div class="form-group">
                    <label>Select Tone</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="tone" value="Friendly" checked>
                            <span class="custom-radio"></span> Friendly
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="tone" value="Conversational">
                            <span class="custom-radio"></span> Conversational
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="tone" value="Encourager">
                            <span class="custom-radio"></span> Encourager
                        </label>
                    </div>
                </div>

                <button type="submit" id="generateBtn" class="pulse-glow">
                    <span class="btn-text">Generate Prompt</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>
        </section>

        <section id="resultCard" class="result-card hidden">
            <div class="result-header">
                <h2>Generated Legal Prompt</h2>
                <button id="copyBtn" class="copy-button">Copy Prompt</button>
            </div>
            <div class="result-body">
                <pre id="outputPrompt"></pre>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
