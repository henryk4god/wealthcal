<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGAL PROMPT GENERATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS VARIABLES & THEME */
        :root {
            --primary: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --primary-dark: #1a365d;
            --primary-light: #ebf8ff;
            --accent: #f6ad55;
            --accent2: #dd6b20;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --font-main: 'Nunito', sans-serif;
            --font-display: 'Playfair Display', serif;
        }

        /* BASE STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 60px;
            animation: fadeIn 0.6s ease-out;
        }

        /* HEADER & BANNER */
        .header-banner {
            position: relative;
            background: var(--primary);
            color: #ffffff;
            text-align: center;
            padding: 60px 20px 80px 20px;
            overflow: hidden;
            clip-path: ellipse(140% 100% at 50% 0%);
        }

        .header-banner::before,
        .header-banner::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }

        .header-banner::before {
            width: 250px;
            height: 250px;
            top: -50px;
            left: -50px;
        }

        .header-banner::after {
            width: 180px;
            height: 180px;
            bottom: -30px;
            right: -30px;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .app-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .app-title {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .app-tagline {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            max-width: 600px;
            margin: 0 auto;
        }

        /* CONTAINER & LAYOUT */
        .container {
            max-width: 800px;
            margin: -40px auto 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* FORM CARD */
        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary-dark);
            font-size: 1.05rem;
        }

        .form-textarea {
            width: 100%;
            height: 180px;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 1rem;
            color: var(--text);
            resize: vertical;
            transition: all 0.3s ease;
        }

        .form-textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.15);
        }

        /* RADIO BUTTONS */
        .radio-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
        }

        .radio-input {
            display: none;
        }

        .radio-input:checked + .radio-label {
            background: var(--primary-light);
            border-color: #2a5298;
            color: var(--primary-dark);
            font-weight: 700;
        }

        /* BUTTON */
        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-family: var(--font-main);
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            animation: pulse-glow 2s infinite;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
        }

        .btn-generate:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-generate:disabled {
            background: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            animation: none;
        }

        /* SPINNER */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        /* RESULT CARD */
        .result-card {
            display: none;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .result-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: var(--primary-dark);
        }

        .btn-copy {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: var(--font-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy:hover {
            background: var(--primary-light);
            border-color: #2a5298;
            color: var(--primary-dark);
        }

        .prompt-preview {
            background: #f8fafc;
            border-left: 5px solid var(--accent);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            white-space: pre-wrap;
            font-family: var(--font-main);
            font-size: 0.95rem;
            color: var(--text);
            max-height: 500px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(42, 82, 152, 0.5); }
            100% { box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3); }
        }

        /* RESPONSIVE MEDIA QUERIES */
        @media (max-width: 600px) {
            .header-banner {
                padding: 40px 15px 60px 15px;
            }
            .app-title {
                font-size: 2rem;
            }
            .form-card {
                padding: 25px 20px;
            }
            .radio-group {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .result-card {
                padding: 25px 20px;
            }
            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .btn-copy {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header class="header-banner">
        <span class="badge">AI-Powered Tool</span>
        <span class="app-icon">⚖️</span>
        <h1 class="app-title">Legal Prompt Generator</h1>
        <p class="app-tagline">Transform your book metadata and outlines into expert legal structuring and front/back matter prompts instantly.</p>
    </header>

    <main class="container">
        
        <section class="form-card">
            <form id="promptForm">
                <div class="form-group">
                    <label class="form-label" for="bookContent">Book Content Information</label>
                    <textarea class="form-textarea" id="bookContent" placeholder="Enter your book metadata here...&#10;e.g.&#10;Title: Master Your Focus&#10;Subtitle: A Guide to Relentless Execution&#10;Body Content: Outline or general premise of your chapters..." required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Tone Formulation</label>
                    <div class="radio-group">
                        <div>
                            <input class="radio-input" type="radio" name="toneSelect" id="toneFriendly" value="Friendly" checked>
                            <label class="radio-label" href="#" for="toneFriendly">Friendly</label>
                        </div>
                        <div>
                            <input class="radio-input" type="radio" name="toneSelect" id="toneConversational" value="Conversational">
                            <label class="radio-label" for="toneConversational">Conversational</label>
                        </div>
                        <div>
                            <input class="radio-input" type="radio" name="toneSelect" id="toneEncourager" value="Encourager">
                            <label class="radio-label" for="toneEncourager">Encourager</label>
                        </div>
                    </div>
                </div>

                <button class="btn-generate" type="submit" id="submitBtn">
                    <span class="spinner" id="btnSpinner"></span>
                    <span id="btnText">Generate Prompt</span>
                </button>
            </form>
        </section>

        <section class="result-card" id="resultCard">
            <div class="result-header">
                <h2 class="result-title">Your Generated Prompt</h2>
                <button class="btn-copy" id="copyBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span id="copyBtnText">Copy Prompt</span>
                </button>
            </div>
            <pre class="prompt-preview" id="promptTextOutput"></pre>
        </section>

    </main>

    <script>
        document.getElementById('promptForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const resultCard = document.getElementById('resultCard');
            const promptTextOutput = document.getElementById('promptTextOutput');
            
            // Activate UI loading parameters
            submitBtn.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.textContent = 'Generating...';
            resultCard.style.display = 'none';

            // Gather elements
            const bookContent = document.getElementById('bookContent').value;
            const selectedTone = document.querySelector('input[name="toneSelect"]:checked').value;

            // Generate structured database architecture string injection
            const compiledPrompt = `You are a bestselling author and professional book formatter. I need you to generate the complete front matter and back matter for my book with these provide information:

INPUT:
${bookContent}


INSTRUCTIONS:

Generate the following FIVE sections in this exact order. Write each section completely and professionally.

SECTION 1: INTRODUCTION

Write a compelling book introduction that includes:
- A personal story or relatable problem the reader faces
- Why you wrote this book
- What makes this book different (including any proprietary frameworks)
- What the reader will learn (list 5-7 key outcomes)
- Who this book is for
- How to use the book
- A promise to the reader
- A call to action to begin

Length: 400-600 words
Tone: ${selectedTone}

SECTION 2: DISCLAIMER

Write a complete legal disclaimer that includes:
- Statement that content is for educational and informational purposes only
- Statement that no professional-client relationship is formed
- Statement that there are no guarantees of results
- Statement about third-party platforms and services
- Statement about regulatory changes
- Statement of no liability
- Acknowledgment that reader is responsible for their own decisions

Tone: Professional, clear, legally protective but not intimidating

SECTION 3: COPYRIGHT

Write a complete copyright notice that includes:
- Copyright symbol, year, and author name
- Statement of all rights reserved
- Rules for unauthorized reproduction
- Rules for permitted excerpts with attribution
- Statement about proprietary frameworks (if applicable)
- Contact email for permission requests
- Publishing details (edition, place of publication)

Tone: Professional and firm but fair

SECTION 4: TABLE OF CONTENTS

Generate a formatted Table of Contents that includes:
- Book title at the top
- "At a Glance" or brief description
- Each chapter number and title (from the outline provided) NO SUB-TOPICS.
- A "Quick Reference" box at the end listing any proprietary frameworks

Format: Clean, scannable, easy to read

SECTION 5: CONCLUSION

Write a powerful book conclusion that includes:
- Acknowledgment that the reader has completed the journey
- Summary of what they should now know or be able to do
- Encouragement to take action (not just read)
- A reminder of the most important framework or lesson from the book
- What comes next (next steps for the reader)
- A final inspiring message
- An invitation to connect or share their success (optional)

Length: 300-500 words
Tone: ${selectedTone} - warm, encouraging, and action-oriented

ADDITIONAL REQUIREMENTS:

- Use [Your Name] as the author placeholder (I will replace it later)
- Use [Your Email Address] as the contact placeholder
- For proprietary frameworks mentioned in the outline, highlight them with 🔷 symbols
- Keep formatting clean and ready to copy-paste into a manuscript

OUTPUT FORMAT:

Label each section clearly with headers:
--- SECTION 1: INTRODUCTION ---
[content]
--- SECTION 2: DISCLAIMER ---
[content]
--- SECTION 3: COPYRIGHT ---
[content]
--- SECTION 4: TABLE OF CONTENTS ---
[content]
--- SECTION 5: CONCLUSION ---
[content]

⚠️ STRICT RULES:
No introductions, conclusions, or commentary outside the deliverable
No filler text or motivational preamble

Now generate these five sections based on my book information above.`;

            // Micro-timed presentation delay for realistic systemic rendering feel
            setTimeout(() => {
                promptTextOutput.textContent = compiledPrompt;
                resultCard.style.display = 'block';
                
                // Revert button parameters back to interactive status
                submitBtn.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.textContent = 'Generate Prompt';
                
                // Smooth operational view alignments
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 750);
        });

        // Copy Clipboard Module integration
        document.getElementById('copyBtn').addEventListener('click', function() {
            const promptText = document.getElementById('promptTextOutput').textContent;
            const copyBtnText = document.getElementById('copyBtnText');
            
            navigator.clipboard.writeText(promptText).then(() => {
                copyBtnText.textContent = 'Copied!';
                setTimeout(() => {
                    copyBtnText.textContent = 'Copy Prompt';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        });
    </script>
</body>
</html>
